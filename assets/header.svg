<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep space animated background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030014">
        <animate attributeName="stop-color" values="#030014;#0B0524;#030014" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0A0A2E">
        <animate attributeName="stop-color" values="#0A0A2E;#101040;#0A0A2E" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#030014">
        <animate attributeName="stop-color" values="#030014;#0B0524;#030014" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Neon gradient for the name -->
    <linearGradient id="neonText" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#A78BFA;#22D3EE;#38BDF8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#22D3EE;#A78BFA;#818CF8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#38BDF8;#818CF8;#22D3EE" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Horizon glow -->
    <radialGradient id="horizon" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#030014" stop-opacity="0"/>
    </radialGradient>

    <!-- Aurora blob gradients -->
    <radialGradient id="aurora1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pulseLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#horizon)"/>

  <!-- Aurora blobs drifting -->
  <ellipse cx="200" cy="120" rx="260" ry="150" fill="url(#aurora1)">
    <animate attributeName="cx" values="200;320;200" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;80;120" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1000" cy="140" rx="280" ry="160" fill="url(#aurora2)">
    <animate attributeName="cx" values="1000;880;1000" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="140;190;140" dur="16s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Perspective grid floor -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.28">
    <line x1="600" y1="290" x2="-350" y2="420"/>
    <line x1="600" y1="290" x2="-80" y2="420"/>
    <line x1="600" y1="290" x2="160" y2="420"/>
    <line x1="600" y1="290" x2="380" y2="420"/>
    <line x1="600" y1="290" x2="600" y2="420"/>
    <line x1="600" y1="290" x2="820" y2="420"/>
    <line x1="600" y1="290" x2="1040" y2="420"/>
    <line x1="600" y1="290" x2="1280" y2="420"/>
    <line x1="600" y1="290" x2="1550" y2="420"/>
  </g>
  <g stroke="#8B5CF6" stroke-width="1" opacity="0.5">
    <line x1="0" y1="300" x2="1200" y2="300" opacity="0.15"/>
    <line x1="0" y1="316" x2="1200" y2="316" opacity="0.25">
      <animate attributeName="y1" values="316;300;316" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="316;300;316" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="338" x2="1200" y2="338" opacity="0.35">
      <animate attributeName="y1" values="338;316;338" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="338;316;338" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="368" x2="1200" y2="368" opacity="0.45">
      <animate attributeName="y1" values="368;338;368" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="368;338;368" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="404" x2="1200" y2="404" opacity="0.55">
      <animate attributeName="y1" values="404;368;404" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="404;368;404" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Horizon line -->
  <rect x="0" y="288" width="1200" height="2" fill="url(#pulseLine)" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating particles -->
  <g fill="#7DD3FC">
    <circle cx="150" cy="200" r="2.2" opacity="0.8">
      <animate attributeName="cy" values="200;60;200" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="240" r="1.6" opacity="0.7">
      <animate attributeName="cy" values="240;90;240" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="230" r="2" opacity="0.7">
      <animate attributeName="cy" values="230;40;230" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="250" r="1.8" opacity="0.8">
      <animate attributeName="cy" values="250;70;250" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="220" r="2.4" opacity="0.7">
      <animate attributeName="cy" values="220;50;220" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="8.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="240" r="1.7" opacity="0.7">
      <animate attributeName="cy" values="240;80;240" dur="10.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="10.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Twinkling stars -->
  <g fill="#FFFFFF">
    <circle cx="90" cy="55" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="35" r="1.1"><animate attributeName="opacity" values="1;0.15;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="60" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="30" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="55" r="1.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="35" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="70" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.85" filter="url(#softGlow)">
    <path d="M28 60 V32 H56"/>
    <path d="M1144 32 H1172 V60"/>
    <path d="M28 360 V388 H56"/>
    <path d="M1144 388 H1172 V360"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Scanning beam sweep -->
  <rect x="-300" y="0" width="240" height="420" fill="url(#scanBeam)" transform="rotate(12 0 0)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 1700 0; 0 0" dur="9s" repeatCount="indefinite" additive="sum"/>
  </rect>

  <!-- Status chip -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="15">
    <rect x="470" y="72" width="260" height="30" rx="15" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.6"/>
    <circle cx="492" cy="87" r="4.5" fill="#4ADE80" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="508" y="92" fill="#7DD3FC" letter-spacing="1">SYSTEM ONLINE · AI MODE</text>
  </g>

  <!-- Name -->
  <text x="600" y="182" text-anchor="middle"
        font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="62" font-weight="900" letter-spacing="2"
        fill="url(#neonText)" filter="url(#glow)">
    MOCHAMAD RIZAL FAUZAN
    <animate attributeName="opacity" values="1;1;0.92;1;1" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- Pulse divider under name -->
  <rect x="330" y="204" width="540" height="2.5" fill="url(#pulseLine)" filter="url(#softGlow)">
    <animate attributeName="width" values="0;540;540;0" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x" values="600;330;330;600" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle -->
  <text x="600" y="240" text-anchor="middle"
        font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="21" font-weight="600" letter-spacing="4" fill="#C7D2FE">
    AI ENGINEER · COMPUTER VISION RESEARCHER · SYSTEM BUILDER
  </text>

  <!-- Terminal typing line -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="16">
    <text x="600" y="272" text-anchor="middle" fill="#67E8F9">
      <tspan fill="#A78BFA">$</tspan> deploying intelligence from research to the real world<tspan fill="#67E8F9">_<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan>
    </text>
  </g>
</svg>
